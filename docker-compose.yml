# Isolated local Postgres + Redis for ad-domain. Loopback only.
# Does not reuse sibling Hub/Context/Memory containers or ports.
# Passwords come from the environment; compose refuses to start without them.
#
#   ADS_POSTGRES_PASSWORD=local-ads-test-only docker compose up -d
#   DATABASE_URL=postgres://ads:${ADS_POSTGRES_PASSWORD}@127.0.0.1:55436/ad_domain
#   REDIS_URL=redis://127.0.0.1:56381
#
# These ports are chosen to avoid sibling Proba / other local maps.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ads
      POSTGRES_PASSWORD: ${ADS_POSTGRES_PASSWORD:?set ADS_POSTGRES_PASSWORD}
      POSTGRES_DB: ad_domain
    ports:
      - "127.0.0.1:55436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads -d ad_domain"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
